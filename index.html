<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สมุดสุขภาพสัตว์เลี้ยง</title>
<link rel="apple-touch-icon" href="https://pitchayaninjen.github.io/pet-record/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cover: #23362D;
    --cover-deep: #182620;
    --page: #FAF6EC;
    --page-alt: #F1EAD8;
    --ink: #2A2620;
    --ink-soft: #6B6355;
    --gold: #B9812E;
    --gold-deep: #8C611F;
    --stamp-red: #9A4232;
    --sage: #7E9683;
    --line: #E1D8C2;
    --white: #FFFFFF;
    --radius-card: 18px;
    --radius-sm: 10px;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --page: #1C1B17;
      --page-alt: #262420;
      --ink: #EFE8D8;
      --ink-soft: #B3AA96;
      --line: #3A362C;
      --white: #232019;
      --cover: #16221C;
      --cover-deep: #0F1913;
    }
  }
  :root[data-theme="dark"] {
    --page: #1C1B17;
    --page-alt: #262420;
    --ink: #EFE8D8;
    --ink-soft: #B3AA96;
    --line: #3A362C;
    --white: #232019;
    --cover: #16221C;
    --cover-deep: #0F1913;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); height: 100%; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100%;
    background: var(--page);
    color: var(--ink);
    font-family: 'IBM Plex Sans Thai', 'IBM Plex Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: 'Fraunces', 'IBM Plex Sans Thai', serif; }

  header.cover {
    background: linear-gradient(180deg, var(--cover) 0%, var(--cover-deep) 100%);
    padding: calc(20px + env(safe-area-inset-top, 0px)) 20px 22px;
    color: #F3ECD8;
    position: relative;
    overflow: hidden;
  }
  header.cover::after {
    content: "";
    position: absolute;
    right: -40px; top: -40px;
    width: 160px; height: 160px;
    border: 1px solid rgba(243,236,216,0.15);
    border-radius: 50%;
  }
  .cover-eyebrow {
    font-size: 12.5px;
    letter-spacing: 0.03em;
    color: #C9BE9C;
    margin: 0 0 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .cloud-pill {
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 100px;
    background: rgba(255,255,255,0.18);
    color: #F3ECD8;
    transition: all 0.3s ease;
  }
  .cover-title {
    font-size: 26px;
    font-weight: 600;
    margin: 0;
    line-height: 1.25;
  }
  .cover-sub {
    margin: 8px 0 0;
    font-size: 13.5px;
    color: #C9BE9C;
    max-width: 46ch;
    line-height: 1.5;
  }

  .pet-strip {
    display: flex;
    gap: 12px;
    padding: 14px 16px 16px;
    overflow-x: auto;
    background: var(--page);
    border-bottom: 1px solid var(--line);
  }
  .pet-strip::-webkit-scrollbar { display: none; }
  .pet-chip {
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: 68px;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    font-family: inherit;
    color: var(--ink);
  }
  .pet-avatar {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--page-alt);
    border: 2px solid transparent;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    font-size: 22px;
    color: var(--ink-soft);
  }
  .pet-chip.active .pet-avatar { border-color: var(--gold); }
  .pet-avatar img { width: 100%; height: 100%; object-fit: cover; }
  .pet-chip-name {
    font-size: 12px;
    max-width: 68px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pet-chip.add-chip .pet-avatar {
    border: 1.5px dashed var(--ink-soft);
    color: var(--ink-soft);
    background: transparent;
  }

  main { padding: 18px 16px 60px; max-width: 640px; margin: 0 auto; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--ink-soft);
  }
  .empty-state .serif { font-size: 20px; color: var(--ink); margin-bottom: 8px; }

  .profile-card {
    display: flex;
    gap: 14px;
    align-items: center;
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: var(--radius-card);
    padding: 16px;
    margin-bottom: 18px;
  }
  .profile-photo {
    width: 72px; height: 72px;
    border-radius: 50%;
    background: var(--page-alt);
    overflow: hidden;
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    color: var(--ink-soft);
    position: relative;
  }
  .profile-photo img { width: 100%; height: 100%; object-fit: cover; }
  .profile-info h2 { margin: 0 0 3px; font-size: 19px; }
  .profile-info p { margin: 0; font-size: 13px; color: var(--ink-soft); }
  .icon-btn {
    margin-left: auto;
    border: none; background: var(--page-alt);
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink-soft); cursor: pointer; font-size: 15px;
    flex: 0 0 auto;
  }

  section.block { margin-bottom: 26px; }
  .block-head {
    display: flex; align-items: baseline; justify-content: space-between;
    margin-bottom: 10px;
  }
  .block-head h3 { font-size: 16.5px; margin: 0; font-weight: 600; }
  .block-head .count { font-size: 12.5px; color: var(--ink-soft); }

  .add-toggle {
    display: inline-flex; align-items: center; gap: 5px;
    background: none; border: 1px solid var(--line);
    color: var(--gold-deep);
    font-family: inherit; font-size: 13px; font-weight: 500;
    padding: 6px 12px; border-radius: 100px; cursor: pointer;
    margin-bottom: 12px;
  }
  .add-toggle:active { background: var(--page-alt); }

  form.entry-form {
    background: var(--page-alt);
    border-radius: var(--radius-card);
    padding: 14px;
    margin-bottom: 14px;
    display: grid;
    gap: 10px;
  }
  form.entry-form .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  label { font-size: 12.5px; color: var(--ink-soft); display: block; margin-bottom: 4px; }
  input, select, textarea {
    width: 100%;
    font-family: inherit;
    font-size: 15px;
    padding: 9px 10px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--line);
    background: var(--white);
    color: var(--ink);
  }
  textarea { resize: vertical; min-height: 46px; }
  input[type="file"] { padding: 6px 4px; font-size: 13px; }
  .form-actions { display: flex; gap: 8px; margin-top: 2px; }
  .btn {
    font-family: inherit;
    border: none;
    border-radius: 100px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .btn-primary { background: var(--gold); color: #2A2000; }
  .btn-primary:active { background: var(--gold-deep); }
  .btn-ghost { background: transparent; color: var(--ink-soft); }

  .weight-card {
    background: var(--white); border: 1px solid var(--line);
    border-radius: var(--radius-card); padding: 14px;
  }
  .weight-now { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .weight-now .num { font-size: 28px; font-weight: 600; font-family: 'Fraunces', serif; }
  .weight-now .unit { font-size: 13px; color: var(--ink-soft); }
  .weight-now .delta { font-size: 12.5px; margin-left: auto; padding: 3px 9px; border-radius: 100px; }
  .delta.up { background: #E9E1CF; color: var(--gold-deep); }
  .delta.down { background: #E4EAE1; color: #3E6B4B; }
  svg.spark { width: 100%; height: 70px; display: block; }

  .log-list { list-style: none; margin: 10px 0 0; padding: 0; }
  .log-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 0; border-top: 1px solid var(--line);
    font-size: 14px;
  }
  .log-row .lr-date { color: var(--ink-soft); width: 78px; flex: 0 0 auto; font-size: 12.5px; }
  .log-row .lr-main { flex: 1; }
  .log-row .lr-note { font-size: 12px; color: var(--ink-soft); }
  .del-btn { border: none; background: none; color: var(--ink-soft); font-size: 13px; cursor: pointer; padding: 4px; }

  .vax-item {
    background: var(--white); border: 1px solid var(--line);
    border-radius: var(--radius-card); padding: 13px 14px;
    margin-bottom: 10px;
    display: flex; gap: 12px;
  }
  .vax-thumb {
    width: 48px; height: 48px; border-radius: var(--radius-sm);
    background: var(--page-alt); flex: 0 0 auto; overflow: hidden;
    display: flex; align-items: center; justify-content: center; color: var(--ink-soft);
  }
  .vax-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .vax-body { flex: 1; min-width: 0; }
  .vax-body .vname { font-weight: 600; font-size: 14.5px; margin-bottom: 2px; }
  .vax-body .vdates { font-size: 12.5px; color: var(--ink-soft); }
  .vax-badge {
    display: inline-block; margin-top: 6px; font-size: 11.5px;
    padding: 3px 9px; border-radius: 100px; font-weight: 600;
  }
  .badge-ok { background: #E4EAE1; color: #3E6B4B; }
  .badge-soon { background: #F3E6C8; color: var(--gold-deep); }
  .badge-late { background: #F1DAD3; color: var(--stamp-red); }

  .appt-row {
    background: var(--white); border: 1px solid var(--line);
    border-radius: var(--radius-card); padding: 13px 14px;
    margin-bottom: 10px; display: flex; align-items: center; gap: 12px;
  }
  .appt-date-box {
    width: 46px; text-align: center; flex: 0 0 auto;
    background: var(--page-alt); border-radius: var(--radius-sm); padding: 6px 0;
  }
  .appt-date-box .d { font-size: 17px; font-weight: 700; font-family: 'Fraunces', serif; line-height: 1; }
  .appt-date-box .m { font-size: 10.5px; color: var(--ink-soft); text-transform: uppercase; }
  .appt-info { flex: 1; min-width: 0; }
  .appt-info .t { font-weight: 600; font-size: 14px; }
  .appt-info .s { font-size: 12px; color: var(--ink-soft); }
  .appt-actions { flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .cal-btn {
    border: 1px solid var(--gold); color: var(--gold-deep);
    background: none; font-family: inherit; font-size: 12px; font-weight: 600;
    padding: 6px 10px; border-radius: 100px; cursor: pointer;
    white-space: nowrap; display: inline-block; text-decoration: none;
  }
  .cal-btn:disabled { opacity: 0.6; cursor: default; }
  .cal-btn.added { border-color: #6B9977; color: #3E6B4B; }

  .backup-row {
    display: flex; gap: 10px; margin-top: 30px; padding-top: 18px;
    border-top: 1px solid var(--line); flex-wrap: wrap;
  }
  .backup-row .btn-ghost { border: 1px solid var(--line); }
  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: var(--cover-deep); color: #F3ECD8;
    padding: 10px 18px; border-radius: 100px; font-size: 13.5px;
    opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease;
    z-index: 50; max-width: 86vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

  .sheet-overlay {
    position: fixed; inset: 0; background: rgba(20,17,10,0.45);
    display: none; align-items: flex-end; z-index: 40;
  }
  .sheet-overlay.show { display: flex; }
  .sheet {
    background: var(--page); width: 100%; max-height: 88vh; overflow-y: auto;
    border-radius: 20px 20px 0 0; padding: 18px 18px calc(22px + env(safe-area-inset-bottom, 0px));
  }
  .sheet h3 { margin: 0 0 14px; font-size: 18px; }
</style>
</head>
<body>

<header class="cover">
  <div class="cover-eyebrow">
    <span>บันทึกไว้ ไม่มีวันลืม</span>
    <span class="cloud-pill" id="cloudStatus">กำลังเชื่อมต่อ...</span>
  </div>
  <h1 class="cover-title serif">สมุดสุขภาพสัตว์เลี้ยง</h1>
  <p class="cover-sub">น้ำหนัก วัคซีน ยาเห็บหมัด ถ่ายพยาธิ และนัดหมายครั้งถัดไป ของเพื่อนตัวน้อยทุกตัว ในที่เดียว</p>
</header>

<nav class="pet-strip" id="petStrip"></nav>

<main id="mainArea"></main>

<div class="toast" id="toast"></div>

<div class="sheet-overlay" id="sheetOverlay">
  <div class="sheet" id="sheetContent"></div>
</div>

<script>
/* =========================================================
   Storage & Google Cloud Sync
========================================================= */
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxPRitYhfKs781l98Oa9wXLysXf4A6FqSu3abCOMO0jSQFICQN2nPaP7KpuGTZ7t-Qy/exec'; 

const STORE_KEY = 'petRecordApp_v1';

function uid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
}

function updateCloudStatus(status, text) {
  const pill = document.getElementById('cloudStatus');
  if (!pill) return;
  pill.textContent = text;
  if (status === 'syncing') pill.style.background = 'rgba(185, 129, 46, 0.4)';
  else if (status === 'synced') pill.style.background = 'rgba(62, 107, 75, 0.4)';
  else if (status === 'error') pill.style.background = 'rgba(154, 66, 50, 0.4)';
}

function loadLocalData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return { pets: [], selectedId: null };
    const parsed = JSON.parse(raw);
    if (!parsed.pets) return { pets: [], selectedId: null };
    return parsed;
  } catch (e) {
    return { pets: [], selectedId: null };
  }
}

let state = loadLocalData();

// บันทึกขึ้น Google Apps Script อัตโนมัติ
async function saveData() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch (e) {
    console.error('local save error', e);
  }

  updateCloudStatus('syncing', 'กำลังบันทึก...');
  try {
    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state)
    });
    updateCloudStatus('synced', 'คลาวด์ซิงค์แล้ว ✓');
  } catch (err) {
    console.error('cloud save error', err);
    updateCloudStatus('error', 'เซฟคลาวด์ไม่สำเร็จ');
  }
}

// ดึงข้อมูลเมื่อเปิดแอป
async function fetchCloudData() {
  updateCloudStatus('syncing', 'กำลังโหลดข้อมูล...');
  try {
    const res = await fetch(GOOGLE_SCRIPT_URL);
    if (res.ok) {
      const cloudData = await res.json();
      if (cloudData && Array.isArray(cloudData.pets)) {
        state = cloudData;
        localStorage.setItem(STORE_KEY, JSON.stringify(state));
        updateCloudStatus('synced', 'คลาวด์ซิงค์แล้ว ✓');
        if (!state.selectedId && state.pets.length) state.selectedId = state.pets[0].id;
        renderAll();
        return;
      }
    }
    updateCloudStatus('synced', 'พร้อมใช้งาน');
  } catch (err) {
    console.error('cloud fetch error', err);
    updateCloudStatus('error', 'ออฟไลน์ (ใช้ข้อมูลเครื่อง)');
  }
}

/* =========================================================
   Direct Add to Groot Calendar via Google Apps Script
========================================================= */
async function addEventToGrootCalendar(appt) {
  try {
    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        action: 'add_event',
        title: appt.title,
        dateISO: appt.date,
        time: appt.time || '',
        location: appt.location || '',
        details: appt.note || ''
      })
    });
    return true;
  } catch (err) {
    console.error('Calendar add error', err);
    return false;
  }
}

/* =========================================================
   Helpers
========================================================= */
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._tm);
  showToast._tm = setTimeout(() => t.classList.remove('show'), 2200);
}

function fmtDateTH(iso) {
  if (!iso) return '-';
  const d = new Date(iso + 'T00:00:00');
  const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + (d.getFullYear() + 543);
}

function todayISO() {
  const d = new Date();
  return d.toISOString().slice(0, 10);
}

function daysUntil(iso) {
  const today = new Date(todayISO() + 'T00:00:00');
  const target = new Date(iso + 'T00:00:00');
  return Math.round((target - today) / 86400000);
}

function resizeImage(file, maxDim = 360, quality = 0.65) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxDim) {
          height = Math.round(height * (maxDim / width));
          width = maxDim;
        } else if (height > maxDim) {
          width = Math.round(width * (maxDim / height));
          height = maxDim;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function getPet(id) { return state.pets.find(p => p.id === id); }
function selectedPet() { return getPet(state.selectedId); }

/* =========================================================
   Rendering: Pet strip
========================================================= */
function renderPetStrip() {
  const strip = document.getElementById('petStrip');
  strip.innerHTML = '';
  state.pets.forEach(pet => {
    const btn = document.createElement('button');
    btn.className = 'pet-chip' + (pet.id === state.selectedId ? ' active' : '');
    btn.innerHTML = `
      <span class="pet-avatar">${pet.photo ? `<img src="${pet.photo}" alt="">` : speciesEmoji(pet.species)}</span>
      <span class="pet-chip-name">${escapeHtml(pet.name)}</span>
    `;
    btn.addEventListener('click', () => { state.selectedId = pet.id; saveData(); renderAll(); });
    strip.appendChild(btn);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'pet-chip add-chip';
  addBtn.innerHTML = `<span class="pet-avatar">+</span><span class="pet-chip-name">เพิ่ม</span>`;
  addBtn.addEventListener('click', openAddPetSheet);
  strip.appendChild(addBtn);
}

function speciesEmoji(species) {
  const s = (species || '').toLowerCase();
  if (s.includes('cat') || s.includes('แมว')) return '🐱';
  if (s.includes('dog') || s.includes('หมา') || s.includes('สุนัข')) return '🐶';
  if (s.includes('bird') || s.includes('นก')) return '🐦';
  if (s.includes('rabbit') || s.includes('กระต่าย')) return '🐰';
  return '🐾';
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str == null ? '' : str;
  return d.innerHTML;
}

/* =========================================================
   Rendering: main area
========================================================= */
function renderAll() {
  renderPetStrip();
  const main = document.getElementById('mainArea');
  const pet = selectedPet();
  if (!pet) {
    main.innerHTML = `
      <div class="empty-state">
        <p class="serif">ยังไม่มีสัตว์เลี้ยงในสมุด</p>
        <p style="margin:0 0 18px;">เริ่มต้นเพิ่มโปรไฟล์สัตว์เลี้ยงตัวแรกของคุณ</p>
        <button class="btn btn-primary" id="emptyAddBtn">+ เพิ่มสัตว์เลี้ยง</button>
      </div>`;
    document.getElementById('emptyAddBtn').addEventListener('click', openAddPetSheet);
    return;
  }
  main.innerHTML = `
    <div class="profile-card">
      <div class="profile-photo">${pet.photo ? `<img src="${pet.photo}" alt="">` : speciesEmoji(pet.species)}</div>
      <div class="profile-info">
        <h2 class="serif">${escapeHtml(pet.name)}</h2>
        <p>${escapeHtml(pet.species || '-')}${pet.breed ? ' · ' + escapeHtml(pet.breed) : ''}${pet.dob ? ' · เกิด ' + fmtDateTH(pet.dob) : ''}</p>
      </div>

/* ---------- Weight block ---------- */
function renderWeightBlock(pet) {
  const block = document.getElementById('weightBlock');
  const weights = [...(pet.weights || [])].sort((a, b) => a.date.localeCompare(b.date));
  const last = weights[weights.length - 1];
  const prev = weights[weights.length - 2];

  let sparkSvg = '';
  if (weights.length >= 2) {
    const vals = weights.map(w => w.kg);
    const min = Math.min(...vals), max = Math.max(...vals);
    const range = (max - min) || 1;
    const W = 300, H = 60, pad = 6;
    const pts = weights.map((w, i) => {
      const x = pad + (i / (weights.length - 1)) * (W - pad * 2);
      const y = H - pad - ((w.kg - min) / range) * (H - pad * 2);
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    });
    sparkSvg = `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <polyline points="${pts.join(' ')}" fill="none" stroke="var(--gold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${pts.map(p => { const [x,y]=p.split(','); return `<circle cx="${x}" cy="${y}" r="2.6" fill="var(--gold-deep)"/>`; }).join('')}
    </svg>`;
  }

  let deltaHtml = '';
  if (last && prev) {
    const diff = +(last.kg - prev.kg).toFixed(2);
    const cls = diff <= 0 ? 'down' : 'up';
    const sign = diff > 0 ? '+' : '';
    deltaHtml = `<span class="delta ${cls}">${sign}${diff} กก. จากครั้งก่อน</span>`;
  }

  block.innerHTML = `
    <div class="block-head">
      <h3>น้ำหนัก</h3>
      <span class="count">${weights.length} รายการ</span>
    </div>
    <div class="weight-card">
      ${last ? `<div class="weight-now"><span class="num">${last.kg}</span><span class="unit">กก. · ล่าสุด ${fmtDateTH(last.date)}</span>${deltaHtml}</div>` : `<p style="color:var(--ink-soft);font-size:14px;margin:0 0 8px;">ยังไม่มีข้อมูลน้ำหนัก</p>`}
      ${sparkSvg}
    </div>
    <button class="add-toggle" id="toggleWeightForm" style="margin-top:12px;">+ เพิ่มน้ำหนัก</button>
    <div id="weightFormWrap"></div>
    ${weights.length ? `<ul class="log-list">
      ${[...weights].reverse().map(w => `
        <li class="log-row">
          <span class="lr-date">${fmtDateTH(w.date)}</span>
          <span class="lr-main">${w.kg} กก.${w.note ? `<div class="lr-note">${escapeHtml(w.note)}</div>` : ''}</span>
          <button class="del-btn" data-del-weight="${w.id}">ลบ</button>
        </li>`).join('')}
    </ul>` : ''}
  `;

  document.getElementById('toggleWeightForm').addEventListener('click', () => {
    const wrap = document.getElementById('weightFormWrap');
    wrap.innerHTML = wrap.innerHTML ? '' : weightFormHtml();
    if (wrap.innerHTML) bindWeightForm(pet);
  });

  block.querySelectorAll('[data-del-weight]').forEach(btn => {
    btn.addEventListener('click', () => {
      pet.weights = pet.weights.filter(w => w.id !== btn.dataset.delWeight);
      saveData(); renderAll();
    });
  });
}

        <div><label>น้ำหนัก (กก.)</label><input type="number" name="kg" step="0.01" min="0" required></div>

      <div><label>บันทึกเพิ่มเติม (ถ้ามี)</label><input type="text" name="note" placeholder="เช่น หลังทำหมัน"></div>

const TYPE_META = {
  vaccine: { label: 'วัคซีน', icon: '💉', apptPrefix: 'นัดฉีดวัคซีน: ', addLabel: 'วัคซีน' },
  flea:    { label: 'ยาเห็บหมัด/ไร', icon: '🦟', apptPrefix: 'นัดหยอดยาเห็บหมัด: ', addLabel: 'ยาเห็บหมัด/ไร' },
  deworm:  { label: 'ถ่ายพยาธิ', icon: '🪱', apptPrefix: 'นัดถ่ายพยาธิ: ', addLabel: 'ถ่ายพยาธิ' },
  other:   { label: 'อื่นๆ', icon: '➕', apptPrefix: 'นัดหมาย: ', addLabel: 'อื่นๆ' }
};
function typeMeta(type) { return TYPE_META[type] || TYPE_META.vaccine; }

function vaxStatus(nextDue) {
  if (!nextDue) return null;
  const d = daysUntil(nextDue);
  if (d < 0) return { cls: 'badge-late', label: `เลยกำหนด ${Math.abs(d)} วัน` };
  if (d <= 14) return { cls: 'badge-soon', label: d === 0 ? 'ครบกำหนดวันนี้' : `อีก ${d} วัน` };
  return { cls: 'badge-ok', label: `ครบกำหนด ${fmtDateTH(nextDue)}` };
}

function bindVaxForm(pet) {
  const typeLabels = { vaccine: 'ฉีด', flea: 'หยอด/ให้ยา', deworm: 'ถ่ายพยาธิ', other: 'ทำ' };
  const namePlaceholders = {
    vaccine: 'เช่น วัคซีนพิษสุนัขบ้า',
    flea: 'เช่น หยอดหลัง Frontline / Bravecto',
    deworm: 'เช่น ยาถ่ายพยาธิ Drontal',
    other: 'ระบุรายการ'
  };
  const typeSelect = document.getElementById('vaxTypeSelect');
  const dateLabel = document.getElementById('vaxDateLabel');
  const nameInput = document.getElementById('vaxNameInput');
  typeSelect.addEventListener('change', () => {
    dateLabel.textContent = 'วันที่' + typeLabels[typeSelect.value];
    nameInput.placeholder = namePlaceholders[typeSelect.value];
  });
  document.getElementById('vaxForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);

      try { photo = await resizeImage(file, 360, 0.65); } catch (err) { console.error(err); }
    }
    const nextDue = fd.get('nextDue') || '';
    pet.vaccines = pet.vaccines || [];
    pet.vaccines.push({
      id: uid(), type: fd.get('type') || 'vaccine', name: fd.get('name'), dateGiven: fd.get('dateGiven'),
      nextDue: nextDue, note: fd.get('note') || '', photo
    });
    saveData(); renderAll(); showToast('บันทึกแล้ว');

    // ถ้ามีกำหนดนัดหมายครั้งถัดไป ให้ส่งไปปฏิทิน Groot อัตโนมัติทันที
    if (nextDue) {
      addEventToGrootCalendar({
        title: typeMeta(fd.get('type')).apptPrefix + fd.get('name') + ' (' + pet.name + ')',
        date: nextDue,
        time: '',
        note: fd.get('note') || '',
        location: ''
      });
      showToast('บันทึกและเพิ่มเข้าปฏิทินอัตโนมัติแล้ว');
    }
  });
}

/* ---------- Appointments block ---------- */
function renderApptBlock(pet) {
  const block = document.getElementById('apptBlock');
  const custom = (pet.appointments || []).map(a => ({ ...a, source: 'custom' }));
  const fromVax = (pet.vaccines || [])
    .filter(v => v.nextDue)
    .map(v => ({
      id: 'vax-' + v.id, title: typeMeta(v.type).apptPrefix + v.name, date: v.nextDue,
      time: '', location: '', note: v.note || '', source: 'vaccine'
    }));
  const all = [...custom, ...fromVax]
    .filter(a => daysUntil(a.date) >= -3650)
    .sort((a, b) => a.date.localeCompare(b.date));

  const months = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

  block.innerHTML = `
    <div class="block-head">
      <h3>นัดหมายถัดไป</h3>
      <span class="count">${all.length} รายการ</span>
    </div>
    <button class="add-toggle" id="toggleApptForm">+ เพิ่มนัดหมายเอง</button>
    <div id="apptFormWrap"></div>
    ${all.length ? all.map(a => {
      const d = new Date(a.date + 'T00:00:00');
      return `
      <div class="appt-row">
        <div class="appt-date-box"><div class="d">${d.getDate()}</div><div class="m">${months[d.getMonth()]}</div></div>
        <div class="appt-info">
          <div class="t">${escapeHtml(a.title)}</div>
          <div class="s">${fmtDateTH(a.date)}${a.time ? ' · ' + a.time + ' น.' : ''}${a.location ? ' · ' + escapeHtml(a.location) : ''}</div>
        </div>
        <div class="appt-actions">
          <button class="cal-btn" data-cal-appt="${a.id}">+ เพิ่มเข้า Calendar</button>
          ${a.source === 'custom' ? `<button class="del-btn" data-del-appt="${a.id}" style="padding:0;">ลบ</button>` : ''}
        </div>
      </div>`;
    }).join('') : `<p style="color:var(--ink-soft);font-size:14px;">ยังไม่มีนัดหมายที่จะถึง</p>`}
  `;

  document.getElementById('toggleApptForm').addEventListener('click', () => {
    const wrap = document.getElementById('apptFormWrap');
    wrap.innerHTML = wrap.innerHTML ? '' : apptFormHtml();
    if (wrap.innerHTML) bindApptForm(pet);
  });

  block.querySelectorAll('[data-cal-appt]').forEach(btn => {
    const appt = all.find(x => x.id === btn.dataset.calAppt);
    if (!appt) return;
    btn.addEventListener('click', async () => {
      btn.disabled = true;
      btn.textContent = 'กำลังเพิ่ม...';
      const ok = await addEventToGrootCalendar({
        title: appt.title + ' (' + pet.name + ')',
        date: appt.date,
        time: appt.time || '',
        location: appt.location || '',
        note: appt.note || ''
      });
      if (ok) {
        btn.textContent = '✓ เพิ่มใน Calendar แล้ว';
        btn.classList.add('added');
        showToast('เพิ่มเข้าปฏิทินสำเร็จ');
      } else {
        btn.disabled = false;
        btn.textContent = '+ เพิ่มเข้า Calendar';
        showToast('เพิ่มไม่สำเร็จ กรุณาลองใหม่อีกครั้ง');
      }
    });
  });

  block.querySelectorAll('[data-del-appt]').forEach(btn => {
    btn.addEventListener('click', () => {
      pet.appointments = (pet.appointments || []).filter(a => a.id !== btn.dataset.delAppt);
      saveData(); renderAll();
    });
  });
}

========================================================= */
function exportData() {
  const json = JSON.stringify(state, null, 2);
  const filename = 'pet-record-backup-' + todayISO() + '.json';
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const parsed = JSON.parse(reader.result);
      if (!parsed.pets) throw new Error('invalid file');
      if (!confirm('นำเข้าข้อมูลนี้จะแทนที่ข้อมูลปัจจุบันทั้งหมด ดำเนินการต่อ?')) return;
      state = parsed;
      saveData(); renderAll(); showToast('นำเข้าข้อมูลสำเร็จ');
    } catch (err) {
      console.error(err);
      showToast('ไฟล์ไม่ถูกต้อง นำเข้าไม่สำเร็จ');
    }
  };
  reader.readAsText(file);
}

/* =========================================================
   Init
========================================================= */
if (!state.selectedId && state.pets.length) state.selectedId = state.pets[0].id;
renderAll();
fetchCloudData();
</script>
